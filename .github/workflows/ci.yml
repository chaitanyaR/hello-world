name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        preset: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake ninja-build \
            libgtest-dev \
            nlohmann-json3-dev \
            lcov

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset=${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build build/${{ matrix.preset }} --parallel $(nproc)

      - name: Unit tests (${{ matrix.preset }})
        if: matrix.preset == 'debug'
        run: ctest --preset=unit --output-on-failure

      - name: Coverage report
        if: matrix.preset == 'debug'
        run: |
          cmake --build build/debug --target coverage || true
          echo "Coverage report generated in build/debug/coverage_report/"

      - name: Upload coverage artifact
        if: matrix.preset == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/debug/coverage_report/
          if-no-files-found: ignore

  integration-test:
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build nlohmann-json3-dev

      - name: Configure (simulation)
        run: cmake --preset=simulation

      - name: Build (simulation)
        run: cmake --build build/sim --parallel $(nproc)

      - name: Integration tests
        run: ctest --preset=integration --output-on-failure
